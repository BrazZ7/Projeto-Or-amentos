name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      # Os testes de integracao exercitam regra fiscal, limite de plano e rate
      # limiting direto no Prisma, entao precisam de um Postgres de verdade.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orcafacil
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orcafacil?schema=public
      NEXTAUTH_SECRET: chave-apenas-para-ci
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
